# The backend runs in a container because it needs tshark, which is a Wireshark
# install rather than a Python package. Nothing in app/aggregation needs this --
# that layer is pure and its tests run on the host with `uv run pytest`.

services:
  backend:
    build:
      context: ./backend
      target: dev
    image: network-graph-backend:dev
    ports:
      - "8000:8000"
    environment:
      # The frontend talks to this through Vite's dev proxy in stage 3, so no
      # cross-origin request is made and no CORS origin is needed here yet.
      NG_TSHARK_BIN: tshark
      NG_MAX_UPLOAD_BYTES: "2147483648"
    volumes:
      # Source is mounted so an edit is picked up without a rebuild; the venv
      # lives at /opt/venv and is deliberately outside the mount.
      - ./backend/app:/srv/app:ro
      - ./backend/tests:/srv/tests:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
